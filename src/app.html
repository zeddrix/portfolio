<!doctype html>
<html lang="en" data-theme="dark" data-palette="cyber_blue">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- Theme initialization: Must run before page renders to prevent FOUC -->
		<script>
			(function () {
				try {
					const theme = localStorage.getItem('preferred_theme') || 'dark';
					const palette = localStorage.getItem('preferred_palette') || 'cyber_blue';
					document.documentElement.setAttribute('data-theme', theme);
					document.documentElement.setAttribute('data-palette', palette);
				} catch (e) {
					// Fallback to defaults if localStorage is unavailable
					document.documentElement.setAttribute('data-theme', 'dark');
					document.documentElement.setAttribute('data-palette', 'cyber_blue');
				}
			})();
		</script>

		<!-- Performance: Resource hints for external services -->
		<!-- Preconnect to Cloudinary for faster image loading -->
		<link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
		<link rel="dns-prefetch" href="https://res.cloudinary.com" />

		<!-- Preconnect to Supabase for faster API calls -->
		<link rel="preconnect" href="https://supabase.co" crossorigin />
		<link rel="dns-prefetch" href="https://supabase.co" />

		<!-- Preconnect to Google Fonts if used -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />

		<!-- Google Fonts: Playfair Display for Squarespace-style elegant headings -->
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

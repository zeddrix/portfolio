name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ""
      PUBLIC_SITE_URL: https://zeddrix.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI environment file
        run: |
          printf '%s\n' \
            "PUBLIC_SITE_URL=${PUBLIC_SITE_URL}" \
            "BASE_PATH=${BASE_PATH}" \
            > .env

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare optimized assets
        run: pnpm assets:prepare

      - name: Quality gate
        run: pnpm quality

      - name: Build static site
        run: pnpm build

      - name: Verify resume download asset
        run: test -f build/resume/Zeddrix-Fabian-Resume.pdf

      - name: Verify static 404 page
        run: grep -q 'noindex, nofollow' build/404.html && ! grep -q '__sveltekit' build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
